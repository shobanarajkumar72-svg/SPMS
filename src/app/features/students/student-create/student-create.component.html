<div class="page-container">
    <div class="page-header">
        <h2>
            Add New Student
        </h2>
        <button mat-stroked-button type="button" (click)="cancel()">
            Back
        </button>
    </div>
    <form [formGroup]="studentForm" (ngSubmit)="save()">
        <div class="student-form">
            <div class="form-group">
                <label class="field-label"> Full Name</label>
                <mat-form-field appearance="fill" class="custom-field">
                    <input matInput formControlName="name" placeholder="Enter name">
                    <mat-error *ngIf="f.name.touched && f.name.invalid">
                        Name minimum 3 characters required
                    </mat-error>
                </mat-form-field>
            </div>
            <div class="form-group">
                <label class="field-label">Email</label>
                <mat-form-field appearance="fill" class="custom-field">
                    <input matInput type="email" formControlName="email" placeholder="Enter email">
                    <mat-error *ngIf="f.email.touched && f.email.invalid">
                        Enter valid email
                    </mat-error>
                </mat-form-field>
            </div>
            <div class="form-group">
                <label class="field-label">Phone</label>
                <mat-form-field appearance="fill" class="custom-field">
                    <input matInput formControlName="phone" placeholder="9876543210">
                    <mat-error *ngIf="f.phone.touched && f.phone.invalid">
                        Enter valid 10 digit phone number
                    </mat-error>
                </mat-form-field>
            </div>
            <div class="form-group">
                <label class="field-label">Department</label>
                <mat-form-field appearance="fill" class="custom-field">
                    <input matInput formControlName="department" placeholder="Computer Science">
                    <mat-error *ngIf="f.department.touched && f.department.invalid">
                        Department required
                    </mat-error>
                </mat-form-field>
            </div>
            <div class="form-group">
                <label class="field-label">Batch</label>
                <mat-form-field appearance="fill" class="custom-field">
                    <input matInput formControlName="batch" placeholder="2026">
                    <mat-error *ngIf="f.batch.touched && f.batch.invalid">
                        Batch required
                    </mat-error>
                </mat-form-field>
            </div>
            <div class="form-group">
                <label class="field-label">CGPA</label>
                <mat-form-field appearance="fill" class="custom-field">
                    <input matInput type="number" formControlName="cgpa" placeholder="8.5">
                    <mat-error *ngIf="f.cgpa.touched && f.cgpa.invalid">
                        CGPA must be between 0 - 10
                    </mat-error>
                </mat-form-field>
            </div>
            <div class="form-group">
                <label class="field-label">Skills</label>
                <mat-form-field appearance="fill" class="custom-field" class="full-width">
                    <input matInput formControlName="skillsText" placeholder="Angular, Java, Python">
                    <mat-error *ngIf="f.skillsText.touched && f.skillsText.invalid">
                        Skills required
                    </mat-error>
                </mat-form-field>
            </div>
            <div class="form-group">
                <label class="field-label"> Status </label>
                <mat-form-field appearance="fill" class="custom-field" class="full-width">
                    <mat-select formControlName="status">
                        <mat-option value="available">
                            Available
                        </mat-option>
                        <mat-option value="placed">
                            Placed
                        </mat-option>
                        <mat-option value="not_eligible">
                            Not Eligible
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>
        <!-- Password -->
<div class="form-group"*ngIf="!editId">
    <label class="field-label">Password</label>
    <mat-form-field appearance="fill" class="custom-field">
        <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            placeholder="Enter Password">

        <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>

        <mat-error *ngIf="f.password.touched && f.password.invalid">
            Password must be at least 6 characters
        </mat-error>
    </mat-form-field>
</div>

<!-- Confirm Password -->
<div class="form-group"*ngIf="!editId">
    <label class="field-label">Confirm Password</label>
    <mat-form-field appearance="fill" class="custom-field">
        <input
            matInput
            [type]="hideConfirmPassword ? 'password' : 'text'"
            formControlName="confirmPassword"
            placeholder="Confirm Password">

        <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="hideConfirmPassword = !hideConfirmPassword">
            <mat-icon>{{ hideConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>

        <mat-error *ngIf="studentForm.hasError('passwordMismatch') && f.confirmPassword.touched">
            Passwords do not match
        </mat-error>
    </mat-form-field>
</div>
        <div class="form-actions">
            <button mat-stroked-button type="button" (click)="cancel()">
                Cancel
            </button>
            <button mat-raised-button color="primary" type="submit" [disabled]="isSaving">
                {{isSaving ? 'Saving...' : 'Save Student'}}
            </button>
        </div>
    </form>
</div>
