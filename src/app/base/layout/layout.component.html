<div class="app-shell" [class.sidebar-closed]="!sidebarOpen">

    <!-- Sidebar -->
    <aside class="sidebar">

        <!-- Logo -->
        <div class="sidebar-logo">
            <div class="logo-circle">
                🎓
            </div>

            <span class="logo-text" *ngIf="sidebarOpen">
                SPMS
            </span>
        </div>


        <!-- Menu -->
        <nav class="sidebar-nav">

            <a 
              *ngFor="let item of filteredNav" 
              [routerLink]="item.route" 
              class="nav-item"
              [class.active]="isActive(item.route)">

                <span class="nav-icon">
                    {{item.icon}}
                </span>

                <span class="nav-label" *ngIf="sidebarOpen">
                    {{item.label}}
                </span>

            </a>

        </nav>



  <!-- Sidebar Footer -->
  <div class="sidebar-footer">

    <button
      type="button"
      class="nav-item logout-btn"
      (click)="confirmLogout()">

      <span class="nav-icon">
        🚪
      </span>

      <span
        class="nav-label"
        *ngIf="sidebarOpen">

        Logout

      </span>

    </button>

  </div>

</aside>

<!-- Logout Confirmation Modal -->
<div
  class="modal-overlay"
  *ngIf="showLogoutConfirm">

  <div class="confirm-dialog">

    <!-- Icon -->
    <div class="confirm-icon">
      🚪
    </div>


    <!-- Title -->
    <h3>
      Logout Confirmation
    </h3>


    <!-- Message -->
    <p>
      Are you sure you want to logout?
    </p>


    <!-- Buttons -->
    <div class="confirm-actions">

      <button
        type="button"
        class="cancel-btn"
        (click)="cancelLogout()">

        Cancel

      </button>


      <button
        type="button"
        class="confirm-btn"
        (click)="confirmLogoutAction()">

        Yes, Logout

      </button>

    </div>

  </div>

</div>



    <!-- Main -->
    <section class="main-area">


        <!-- Navbar -->
        <header class="topbar">


            <button 
              class="menu-btn" 
              (click)="toggleSidebar()">

                ☰

            </button>



            <div class="title">

                Student Placement Management System

            </div>




            <div class="top-actions">



                <span class="user-name">

                    {{user?.name}}

                </span>




                <div class="avatar">

                    {{user?.name?.charAt(0)}}

                </div>



            </div>


        </header>





        <!-- Content -->

        <main class="content">

            <router-outlet></router-outlet>

        </main>





        <!-- Footer -->

        <footer class="footer">

            © 2026 Student Placement Management System

        </footer>


    </section>


</div>
