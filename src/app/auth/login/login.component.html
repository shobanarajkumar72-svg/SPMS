<!-- login.component.html -->
<div class="login-wrapper">
    <div class="login-details">
        <!-- Left Panel: Form -->
        <div class="form-panel">
            <!-- Logo -->
            <div class="logo">
                <span class="logo-icon">🎓</span>
                <span class="logo-name">SPMS</span>
                <span class="logo-divider">|</span>
                <span class="logo-subtitle">Student Placement<br>Management System</span>
            </div>

            <!-- Heading -->
            <h1 class="heading">Welcome Back!</h1>
            <p class="sub-heading">Login to your account to continue</p>

            <!-- Form -->
            <div class="form">

                <!-- Email Field -->
                <div class="field-group">
                    <label class="field-label" for="email">Email</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect x="2" y="4" width="20" height="16" rx="2" />
                                <path d="M2 7l10 7 10-7" />
                            </svg>
                        </span>
                        <input id="email" type="email" class="input-field" placeholder="Enter your email"
                            [(ngModel)]="email" name="email" autocomplete="email" />
                    </div>
                </div>

                <!-- Password Field -->
                <div class="field-group">
                    <label class="field-label" for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                        </span>
                        <input id="password" [type]="showPassword ? 'text' : 'password'" class="input-field"
                            placeholder="Enter your password" [(ngModel)]="password" name="password"
                            autocomplete="current-password" />
                        <button type="button" class="eye-btn" (click)="togglePassword()"
                            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
                            <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <path
                                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                                <line x1="1" y1="1" x2="23" y2="23" />
                            </svg>
                            <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="form-options">
                    <label class="remember-label">
                        <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" class="checkbox" />
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <!-- Login Button -->
                <button class="btn-login" (click)="onLogin()" [disabled]="isLoading || !email || !password">
                    <span *ngIf="!isLoading">Login</span>
                    <span *ngIf="isLoading" class="spinner"></span>
                </button>

                <!-- Divider -->
                <div class="divider">
                    <span>or continue with</span>
                </div>

                <!-- Social Login -->
                <div class="social-btns">
                    <button class="btn-social" (click)="loginWithGoogle()">
                        <svg width="20" height="20" viewBox="0 0 48 48">
                            <path fill="#EA4335"
                                d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                            <path fill="#4285F4"
                                d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                            <path fill="#FBBC05"
                                d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                            <path fill="#34A853"
                                d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                        </svg>
                        Google
                    </button>
                    <button class="btn-social" (click)="loginWithMicrosoft()">
                        <svg width="20" height="20" viewBox="0 0 21 21">
                            <rect x="1" y="1" width="9" height="9" fill="#F25022" />
                            <rect x="11" y="1" width="9" height="9" fill="#7FBA00" />
                            <rect x="1" y="11" width="9" height="9" fill="#00A4EF" />
                            <rect x="11" y="11" width="9" height="9" fill="#FFB900" />
                        </svg>
                        Microsoft
                    </button>
                </div>

                <!-- Register -->
                <p class="register-text">
                    Don't have an account?
                    <a routerLink="/register" class="register-link">Register here</a>
                </p>

            </div>
        </div>

        <!-- Right Panel: Illustration -->
        <div class="illustration-panel">
            <div class="circle-bg"></div>
            <div class="illustration-placeholder">
                <img src="login.png" alt="" srcset="">
            </div>
        </div>

    </div>
</div>
